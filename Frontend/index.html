<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Определение эмоции по фото</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="ava.jpg" type="image/jpeg">
</head>
<body>

<div class="container">
    <h1>Загрузите изображение</h1>

    <form action="http://localhost:8000/web/process" method="post" enctype="multipart/form-data" class="upload-form">
        <label for="fileInput" class="drop-zone">
            <p>Перетащите изображение сюда или нажмите для выбора</p>
            <input type="file" name="file" id="fileInput" accept="image/*" required>
        </label>
        <button type="submit">Старт</button>
    </form>
</div>

</body>
</html>
